# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "bd4c1b906750205d3e570893697cbdf5"
name = "IKEO Post-Purchase Survey"
application_url = "https://post-purchase-survey-nine.vercel.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_metaobjects,write_metaobject_definitions,write_files,read_orders,read_customers,write_customers,read_products"

# Published survey for theme / branded / embed channels (Liquid + Storefront API).
# Values are written on Save via metaobjectUpsert; handle = survey id.
[metaobjects.app.survey]
name = "Survey"
description = "Published survey render payload for storefront channels"
display_name_field = "title"

  [metaobjects.app.survey.access]
  admin = "merchant_read"
  storefront = "public_read"

[metaobjects.app.survey.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.survey.fields.payload]
name = "Payload"
type = "json"
required = true

# Which survey handles are enabled per channel key (not the full surveys).
[shop.metafields.app.channel_index]
type = "json"
name = "Channel index"
description = "Enabled survey handles keyed by channel for theme app embeds"

  [shop.metafields.app.channel_index.access]
  admin = "merchant_read"
  storefront = "public_read"

# Compact JSON for Thank you + Order status (+ later POS) checkout extensions.
# Declared again in the post-purchase extension.toml [[extensions.metafields]].
[shop.metafields.app.checkout_surveys]
type = "json"
name = "Checkout surveys"
description = "Published surveys for Thank you and Order status page extensions"

  [shop.metafields.app.checkout_surveys.access]
  admin = "merchant_read"
  storefront = "none"

# Per-customer completion map for “once per customer” display recurrence (Admin read/write via app).
[customer.metafields.app.survey_completions]
type = "json"
name = "Survey completions"
description = "Survey UUID keys with completion time and order id for display recurrence"

  [customer.metafields.app.survey_completions.access]
  admin = "merchant_read"
  storefront = "none"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory App Store compliance webhooks — use compliance_topics, not topics.
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[auth]
# Must match authPathPrefix `/auth` in app/shopify.server.ts (React Router template).
redirect_urls = [
  "https://post-purchase-survey-nine.vercel.app/auth/callback",
]

[build]
automatically_update_urls_on_dev = true
